<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" role="img" aria-label="Most Used Languages">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .lang  { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="399" height="194" fill="#1a1b27" stroke="#1a1b27"/>
