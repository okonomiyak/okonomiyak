    <rect x="364.90" y="50" width="3.92" height="8" fill="#4298b8"/>
    <rect x="368.82" y="50" width="3.27" height="8" fill="#555555"/>
    <rect x="372.10" y="50" width="2.90" height="8" fill="#f34b7d"/>
