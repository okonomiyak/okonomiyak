<svg xmlns="http://www.w3.org/2000/svg" width="300" height="151" viewBox="0 0 300 151" role="img" aria-label="Most Used Languages">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .lang  { font: 400 11px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="299" height="150" fill="#1a1b27" stroke="#1a1b27"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <mask id="bar-mask"><rect x="25" y="50" width="250" height="8" rx="5" fill="#fff"/></mask>
  <g mask="url(#bar-mask)">
    <rect x="25.00" y="50" width="206.76" height="8" fill="#b07219"/>
    <rect x="231.76" y="50" width="39.57" height="8" fill="#dea584"/>
    <rect x="271.33" y="50" width="2.26" height="8" fill="#89e051"/>
    <rect x="273.59" y="50" width="0.96" height="8" fill="#f1e05a"/>
    <rect x="274.55" y="50" width="0.45" height="8" fill="#384d54"/>
  </g>
  <circle cx="30" cy="81" r="5" fill="#b07219"/>
  <text x="40" y="85" class="lang">Java 82.7%</text>
  <circle cx="160" cy="81" r="5" fill="#dea584"/>
  <text x="170" y="85" class="lang">Rust 15.8%</text>
  <circle cx="30" cy="103" r="5" fill="#89e051"/>
  <text x="40" y="107" class="lang">Shell 0.9%</text>
  <circle cx="160" cy="103" r="5" fill="#f1e05a"/>
  <text x="170" y="107" class="lang">JavaScript 0.4%</text>
  <circle cx="30" cy="125" r="5" fill="#384d54"/>
  <text x="40" y="129" class="lang">Dockerfile 0.2%</text>
</svg>
