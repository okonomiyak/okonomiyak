<svg xmlns="http://www.w3.org/2000/svg" width="400" height="195" viewBox="0 0 400 195" role="img" aria-label="Most Used Languages">
  <style>
    .title { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #70a5fd; }
    .label { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .value { font: 700 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
    .lang  { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #38bdae; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" width="399" height="194" fill="#1a1b27" stroke="#1a1b27"/>
  <text x="25" y="35" class="title">Most Used Languages</text>
  <mask id="bar-mask"><rect x="25" y="50" width="350" height="8" rx="5" fill="#fff"/></mask>
  <g mask="url(#bar-mask)">
    <rect x="25.00" y="50" width="285.30" height="8" fill="#b07219"/>
    <rect x="310.30" y="50" width="59.60" height="8" fill="#dea584"/>
    <rect x="369.90" y="50" width="3.12" height="8" fill="#89e051"/>
    <rect x="373.02" y="50" width="1.36" height="8" fill="#f1e05a"/>
    <rect x="374.38" y="50" width="0.62" height="8" fill="#384d54"/>
  </g>
  <circle cx="30" cy="84" r="5" fill="#b07219"/>
  <text x="40" y="88" class="lang">Java 81.5%</text>
  <circle cx="205" cy="84" r="5" fill="#dea584"/>
  <text x="215" y="88" class="lang">Rust 17.0%</text>
  <circle cx="30" cy="110" r="5" fill="#89e051"/>
  <text x="40" y="114" class="lang">Shell 0.9%</text>
  <circle cx="205" cy="110" r="5" fill="#f1e05a"/>
  <text x="215" y="114" class="lang">JavaScript 0.4%</text>
  <circle cx="30" cy="136" r="5" fill="#384d54"/>
  <text x="40" y="140" class="lang">Dockerfile 0.2%</text>
</svg>
